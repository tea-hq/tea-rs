[package]
name = "tea-coding"
version = "0.1.0"
description = "Coding profile, configuration, resources, and session service for tea-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false
readme = "README.md"
keywords = ["agent", "coding", "runtime"]
categories = ["development-tools"]

[lib]
doctest = false

[dependencies]
tea = { package = "tea-rs", version = "=0.1.0", path = "../tea" }
tea-coding-tools = { version = "=0.1.0", path = "../tea-coding-tools" }
tea-context = { version = "=0.1.0", path = "../tea-context" }
tea-kernel = { version = "=0.1.0", path = "../tea-kernel" }
tea-mcp = { version = "=0.1.0", path = "../tea-mcp" }
tea-model = { version = "=0.1.0", path = "../tea-model" }
tea-policy = { version = "=0.1.0", path = "../tea-policy" }
tea-profile = { version = "=0.1.0", path = "../tea-profile" }
tea-protocol = { version = "=0.1.0", path = "../tea-protocol" }
tea-provider-openai = { version = "=0.1.0", path = "../tea-provider-openai" }
tea-session = { version = "=0.1.0", path = "../tea-session" }
tea-session-sqlite = { version = "=0.1.0", path = "../tea-session-sqlite" }
tea-tools = { version = "=0.1.0", path = "../tea-tools" }
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
ignore.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
tea-control = { version = "=0.1.0", path = "../tea-control" }
tea-testkit = { version = "=0.1.0", path = "../tea-testkit" }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
