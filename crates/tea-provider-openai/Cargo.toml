[package]
name = "tea-provider-openai"
version = "0.1.0"
description = "OpenAI-compatible streaming provider adapter for tea-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false
readme = "README.md"
keywords = ["agent", "openai", "provider"]
categories = ["api-bindings", "asynchronous"]

[lib]
doctest = false

[dependencies]
tea-control = { version = "=0.1.0", path = "../tea-control" }
tea-model = { version = "=0.1.0", path = "../tea-model" }
tea-provider-http = { version = "=0.1.0", path = "../tea-provider-http" }
tea-protocol = { version = "=0.1.0", path = "../tea-protocol" }
async-stream = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
jsonschema = { workspace = true, optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
# Security floor for Reqwest's transitive URL parser (RUSTSEC-2024-0421).
url = { workspace = true }

[dev-dependencies]
tea-testkit = { version = "=0.1.0", path = "../tea-testkit" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[features]
default = []
# Enable the live smoke test helpers. Smoke tests are #[ignore]d and require
# a real API key via the .env contract; they never run in CI.
live = ["dep:jsonschema"]

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
