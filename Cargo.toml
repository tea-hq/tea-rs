[workspace]
resolver = "2"
members = [
  "crates/tea-cli",
  "crates/tea-coding",
  "crates/tea-coding-tools",
  "crates/tea-context",
  "crates/tea-control",
  "crates/tea-kernel",
  "crates/tea-mcp",
  "crates/tea-model",
  "crates/tea-policy",
  "crates/tea-profile",
  "crates/tea-protocol",
  "crates/tea",
  "crates/tea-provider-anthropic",
  "crates/tea-provider-http",
  "crates/tea-provider-openai",
  "crates/tea-session",
  "crates/tea-session-sqlite",
  "crates/tea-testkit",
  "crates/tea-tools",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/tea-hq/tea-rs.git"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "event-stream", "windows"] }
futures-core = "=0.3.31"
futures-util = { version = "=0.3.31", default-features = false, features = ["async-await", "std"] }
globset = "=0.4.16"
idna = "=1.0.3"
ignore = "=0.4.23"
jsonschema = { version = "=0.26.2", default-features = false }
reqwest = { version = "=0.12.22", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["client"] }
async-stream = "=0.3.6"
brotli = "=8.0.4"
dom_query = { version = "=0.27.0", default-features = false }
encoding_rs = "=0.8.35"
flate2 = "=1.1.9"
mime = "=0.3.17"
nix = { version = "=0.30.1", default-features = false, features = ["process", "signal"] }
os_info = "=3.12.0"
portable-pty = "=0.9.0"
pulldown-cmark = "=0.13.0"
rusqlite = { version = "=0.32.1", default-features = false, features = ["bundled"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
regex = "=1.11.1"
semver = { version = "=1.0.26", features = ["serde"] }
similar = "=2.7.0"
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "=1.0.140"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
syntect = { version = "=5.3.0", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "regex-onig",
] }
thiserror = "=2.0.12"
textwrap = "=0.16.2"
tokio = { version = "=1.47.1", default-features = false, features = ["macros", "rt"] }
tokio-util = { version = "=0.7.16", default-features = false, features = ["rt"] }
unicode-segmentation = "=1.13.3"
unicode-width = { version = "=0.2.2", default-features = false, features = ["cjk"] }
url = "=2.5.4"
uuid = { version = "=1.17.0", features = ["serde", "v7"] }
vt100 = "=0.16.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"
